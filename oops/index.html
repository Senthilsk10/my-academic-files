<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Learning Cards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            transition: all 0.3s ease;
        }

        /* Presentation Mode Styles */
        .presentation-mode {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            z-index: 1000;
            display: none;
            overflow: hidden;
        }

        .presentation-mode.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Navigation Buttons */
        .nav-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 1001;
            display: none;
        }

        .presentation-active .nav-btn {
            display: flex;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-50%) scale(1.1);
        }

        .nav-btn.prev {
            left: 30px;
        }

        .nav-btn.next {
            right: 30px;
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Slide Counter */
        .slide-counter {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            z-index: 1001;
            display: none;
        }

        .presentation-active .slide-counter {
            display: block;
        }

        /* Exit Button */
        .exit-btn {
            position: fixed;
            top: 30px;
            right: 30px;
            background: rgba(255, 0, 0, 0.7);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            z-index: 1001;
            transition: all 0.3s ease;
            display: none;
        }

        .presentation-active .exit-btn {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .exit-btn:hover {
            background: rgba(255, 0, 0, 0.9);
            transform: scale(1.1);
        }

        /* Presentation styling for cards */
        .presentation-active .container {
            filter: blur(5px);
            pointer-events: none;
        }

        .presentation-active .add-card-btn {
            display: none;
        }

        .card-presentation-view {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 90%;
            max-width: 1000px;
            height: 80vh;
            z-index: 1002;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .card-presentation-view.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .presentation-meme-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            width: 100%;
            height: 100%;
            display: flex;
            perspective: 1000px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .presentation-meme-inner {
            width: 100%;
            height: 100%;
            transition: transform 0.8s;
            transform-style: preserve-3d;
            position: relative;
        }

        .presentation-meme-card.flipped .presentation-meme-inner {
            transform: rotateY(180deg);
        }

        .presentation-meme-front, .presentation-meme-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            border-radius: 20px;
        }

        .presentation-meme-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .presentation-meme-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 15px;
            cursor: pointer;
        }

        .presentation-meme-front {
            background: #f8f9fa;
        }

        .presentation-meme-img.portrait {
            object-fit: contain;
            max-height: 90%;
            width: auto;
        }

        .presentation-meme-img.landscape {
            object-fit: contain;
            max-width: 90%;
            height: auto;
        }

        .presentation-concept-text {
            font-size: 2rem;
            line-height: 1.6;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Updated Presentation Code Card - Split Layout */
        .presentation-code-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .presentation-code-header {
            background: linear-gradient(45deg, #2c3e50, #34495e);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .presentation-code-title {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .presentation-execute-btn {
            background: linear-gradient(45deg, #27ae60, #2ecc71);
            border: none;
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .presentation-execute-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.4);
        }

        /* Split layout for code and output */
        .presentation-code-content {
            flex: 1;
            display: flex;
            min-height: 0; /* Important for flexbox scrolling */
            pointer-events: auto;
        }

        .presentation-code-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            padding-right: 10px;
            pointer-events: auto;
        }

        .presentation-output-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            padding-left: 10px;
            border-left: 2px solid #e2e8f0;
            pointer-events: auto;
        }

        .presentation-code-block {
            background: #2d3748;
            color: #e2e8f0;
            padding: 20px;
            border-radius: 15px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            flex: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #4a5568 #2d3748;
            cursor: text;
            user-select: text;
            pointer-events: auto;
        }

        /* Custom scrollbar for webkit browsers */
        .presentation-code-block::-webkit-scrollbar {
            width: 8px;
        }

        .presentation-code-block::-webkit-scrollbar-track {
            background: #2d3748;
            border-radius: 4px;
        }

        .presentation-code-block::-webkit-scrollbar-thumb {
            background: #4a5568;
            border-radius: 4px;
        }

        .presentation-code-block::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        .presentation-output-section {
            background: #f7fafc;
            border: 3px dashed #cbd5e0;
            border-radius: 15px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            scrollbar-width: thin;
            scrollbar-color: #9ca3af #f7fafc;
            cursor: text;
            user-select: text;
            pointer-events: auto;
        }

        .presentation-output-section::-webkit-scrollbar {
            width: 8px;
        }

        .presentation-output-section::-webkit-scrollbar-track {
            background: #f7fafc;
            border-radius: 4px;
        }

        .presentation-output-section::-webkit-scrollbar-thumb {
            background: #9ca3af;
            border-radius: 4px;
        }

        .presentation-output-section::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        .presentation-output-section.has-output {
            background: #f0fff4;
            border-color: #68d391;
        }

        .output-label {
            font-size: 16px;
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        /* Regular Mode Styles */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            transition: all 0.3s ease;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .controls {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .controls h3 {
            color: white;
            margin-bottom: 15px;
        }

        .json-editor {
            width: 100%;
            height: 200px;
            background: rgba(0,0,0,0.7);
            color: #00ff00;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
        }

        .btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a6f);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            margin: 10px 5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .btn.secondary {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
        }

        .btn.presentation {
            background: linear-gradient(45deg, #9b59b6, #8e44ad);
        }

        .cards-container {
            display: grid;
            gap: 30px;
        }

        /* Regular Meme Card Styles */
        .meme-card {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            perspective: 1000px;
            cursor: pointer;
        }

        .meme-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .meme-card-inner {
            position: relative;
            width: 100%;
            height: 400px;
            text-align: center;
            transition: transform 0.8s;
            transform-style: preserve-3d;
        }

        .meme-card.flipped .meme-card-inner {
            transform: rotateY(180deg);
        }

        .meme-card-front, .meme-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .meme-card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .meme-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 10px;
        }

        .concept-text {
            font-size: 1.2rem;
            line-height: 1.6;
            text-align: center;
        }

        /* Regular Code Block Styles */
        .code-card {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .code-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .code-header {
            background: linear-gradient(45deg, #2c3e50, #34495e);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-title {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .execute-btn {
            background: linear-gradient(45deg, #27ae60, #2ecc71);
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .execute-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4);
        }

        .code-content {
            padding: 20px;
        }

        .code-block {
            background: #2d3748;
            color: #e2e8f0;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            overflow-x: auto;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        .output-section {
            background: #f7fafc;
            border: 2px dashed #cbd5e0;
            border-radius: 10px;
            padding: 20px;
            min-height: 100px;
            font-family: 'Courier New', monospace;
        }

        .output-section.has-output {
            background: #f0fff4;
            border-color: #68d391;
        }

        .add-card-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff6b6b, #ee5a6f);
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.4);
            transition: all 0.3s ease;
        }

        .add-card-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(255, 107, 107, 0.6);
        }

        /* Encoding Helper */
        .encoding-helper {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .encoding-helper h4 {
            color: white;
            margin-bottom: 10px;
        }

        .encoding-input {
            width: 100%;
            height: 80px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-family: 'Courier New', monospace;
            margin-bottom: 10px;
            resize: vertical;
        }

        @media (max-width: 1024px) {
            .presentation-code-content {
                flex-direction: column;
            }
            
            .presentation-code-section,
            .presentation-output-container {
                flex: none;
                padding: 15px;
            }
            
            .presentation-output-container {
                border-left: none;
                border-top: 2px solid #e2e8f0;
                padding-left: 15px;
                padding-top: 15px;
            }
            
            .presentation-code-block,
            .presentation-output-section {
                height: 300px;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .presentation-concept-text {
                font-size: 1.5rem;
            }
            
            .presentation-code-title {
                font-size: 1.4rem;
            }
            
            .presentation-code-block {
                font-size: 14px;
            }
            
            .nav-btn {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }

            .card-presentation-view {
                width: 98%;
                height: 90%;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Controls (initially hidden) -->
    <button class="nav-btn prev" id="prevBtn" onclick="changeSlide(-1)">‹</button>
    <button class="nav-btn next" id="nextBtn" onclick="changeSlide(1)">›</button>
    <div class="slide-counter" id="slideCounter">1 / 1</div>
    <button class="exit-btn" onclick="exitPresentation()">✕</button>

    <!-- Card Presentation View -->
    <div id="cardPresentationView" class="card-presentation-view">
        <!-- Active card will be cloned here -->
    </div>

    <!-- Regular Mode -->
    <div class="container">
        <div class="header" style="display: none;">
            <h1>🎓 Interactive Learning Cards</h1>
            <p>Create engaging educational content with meme flashcards and executable code blocks</p>
        </div>

        <div class="encoding-helper" style="display:none">
            <h4>🔧 Base64 Encoding Helper</h4>
            <textarea id="encodeInput" class="encoding-input" placeholder="Enter your code/text here to encode..."></textarea>
            <button class="btn secondary" onclick="encodeToBase64()">Encode to Base64</button>
            <button class="btn secondary" onclick="decodeFromBase64()">Decode from Base64</button>
        </div>

        <div class="controls" style="display: none;">
            <h3>📝 JSON Editor (Base64 Encoded)</h3>
            <textarea id="jsonEditor" class="json-editor" placeholder="Enter your JSON configuration here...">
                [
                    {
                        "type": "meme",
                        "image":"/imgs/wide-usage.jpeg",
                        "concept": "Welcome to Java OOP!"
                    },
                    {
                        "type":"meme",
                        "image":"https://i.redd.it/1lxxu5jon3se1.jpeg",
                        "concept":"Object oriented Programming using JAVA"
                    },
                    {
                        "type":"meme",
                        "image":"/imgs/objects.jpg",
                        "concept":"In any Object Oriented Programming languages, Everything is considered as objects. Think of classes like cookie cutters and objects like the actual cookies. You can't eat a cookie cutter, but you can definitely eat the cookies it makes! 🍪 Classes are blueprints, objects are the real deal!"

                    {
                        "type": "meme",
                        "image":"/imgs/class-object.jpeg",
                        "concept": "DEFINITION: A Class is a template/blueprint that defines the structure and behavior (attributes and methods) for objects. An Object is an instance of a class - it's the actual thing created from the blueprint with real values."
                    },
                    {
                        "type": "code",
                        "title": "Your First Class - Cookie Factory",
                        "code": "class Cookie {\n    String flavor;\n    int size;\n    \n    void bake() {\n        System.out.println(\"Baking \" + flavor + \" cookie!\");\n    }\n}\n\npublic class CookieFactory {\n    public static void main(String[] args) {\n        Cookie chocChip = new Cookie();\n        chocChip.flavor = \"Chocolate Chip\";\n        chocChip.bake();\n    }\n}",
                        "output": "Baking Chocolate Chip cookie!"
                    },
                    {
                        "type": "code",
                        "title": "Challenge: Guess the Output",
                        "code": "class Phone {\n    String brand = \"Unknown\";\n    int battery = 100;\n    \n    void call() {\n        battery -= 10;\n        System.out.println(brand + \" calling... Battery: \" + battery + \"%\");\n    }\n}\n\npublic class Test {\n    public static void main(String[] args) {\n        Phone myPhone = new Phone();\n        myPhone.brand = \"iPhone\";\n        myPhone.call();\n        myPhone.call();\n    }\n}",
                        "output": "iPhone calling... Battery: 90%\niPhone calling... Battery: 80%"
                    },
                    {
                        "type": "meme",
                        "image":"/imgs/encap-2.jpg",
                        "concept": "Encapsulation is like having a TV remote control. You don't need to know how the TV circuits work internally - you just press buttons! Private variables are the internal circuits, public methods are your buttons. Hide the complexity, show only what's needed!"
                    },
                    {
                        "type": "meme",
                        "image":"/imgs/encap-1.webp",
                        "concept": "DEFINITION: Encapsulation is the OOP principle of bundling data (variables) and methods that operate on that data into a single unit (class), while restricting direct access to internal components using access modifiers (private, protected, public)."
                    },
                    {
                        "type": "code",
                        "title": "Encapsulation - Bank Account Security",
                        "code": "class BankAccount {\n    private double balance = 1000;\n    private String pin = \"1234\";\n    \n    public boolean withdraw(String userPin, double amount) {\n        if (!userPin.equals(pin)) {\n            System.out.println(\"Wrong PIN! Access Denied 🚫\");\n            return false;\n        }\n        if (amount > balance) {\n            System.out.println(\"Insufficient funds!\");\n            return false;\n        }\n        balance -= amount;\n        System.out.println(\"Withdrawn: $\" + amount + \". Balance: $\" + balance);\n        return true;\n    }\n}",
                        "output": "// Safe banking - outsiders can't directly access balance or pin!"
                    },
                    {
                        "type": "code",
                        "title": "Challenge: Access Control",
                        "code": "class SocialMedia {\n    private String password = \"secret123\";\n    private int followers = 1000;\n    \n    public void login(String pass) {\n        if (pass.equals(password)) {\n            System.out.println(\"Welcome! You have \" + followers + \" followers\");\n        } else {\n            System.out.println(\"Login failed!\");\n        }\n    }\n    \n    public void addFollower() {\n        followers++;\n        System.out.println(\"New follower! Total: \" + followers);\n    }\n}\n\nSocialMedia account = new SocialMedia();\naccount.login(\"wrong\");\naccount.login(\"secret123\");\naccount.addFollower();",
                        "output": "Login failed!\nWelcome! You have 1000 followers\nNew follower! Total: 1001"
                    },
                    {
                        "type": "meme",
                        "image":"/imgs/inheritance.jpg",
                        "concept": "Inheritance is like family traits! 👨‍👩‍👧‍👦 Kids inherit features from parents - brown eyes, height, even dad jokes! In Java, child classes inherit methods and variables from parent classes. 'extends' is like saying 'I got this from my parent class!'"
                    },
                    {
                        "type": "meme",
                        "image":"/imgs/inheritance-types.png",
                        "concept": "DEFINITION: Inheritance is the OOP principle where a new class (child/subclass) acquires properties and behaviors from an existing class (parent/superclass) using the 'extends' keyword. This promotes code reusability and establishes an 'is-a' relationship."
                    },
                    {
                        "type": "code",
                        "title": "Inheritance - Vehicle Family",
                        "code": "class Vehicle {\n    String brand;\n    int speed = 0;\n    \n    void start() {\n        System.out.println(brand + \" is starting...\");\n    }\n    \n    void accelerate() {\n        speed += 10;\n        System.out.println(\"Speed: \" + speed + \" km/h\");\n    }\n}\n\nclass Car extends Vehicle {\n    int doors = 4;\n    \n    void honk() {\n        System.out.println(\"Beep beep! 🚗\");\n    }\n}\n\nCar myCar = new Car();\nmyCar.brand = \"Toyota\";\nmyCar.start();  // Inherited!\nmyCar.honk();   // Own method",
                        "output": "Toyota is starting...\nBeep beep! 🚗"
                    },
                    {

            <div>
                <button class="btn" onclick="loadFromJSON()">🚀 Load Cards</button>
                <button class="btn presentation" onclick="startPresentation()">🎬 Presentation Mode</button>
                <button class="btn secondary" onclick="exportJSON()">💾 Export JSON</button>
                <button class="btn secondary" onclick="clearAll()">🗑️ Clear All</button>
            </div>
        </div>

        <div id="cardsContainer" class="cards-container">
            <!-- Cards will be dynamically generated here -->
        </div>
    </div>

    <button style="display: none;"" class="add-card-btn" onclick="addNewCard()">+</button>

    <script>
        let cardsData = [];
        let currentSlide = 0;
        let isPresentationMode = false;

        // Base64 Encoding/Decoding Functions
        function encodeToBase64() {
            const input = document.getElementById('encodeInput');
            const text = input.value;
            if (text) {
                const encoded = btoa(unescape(encodeURIComponent(text)));
                input.value = encoded;
            }
        }

        function decodeFromBase64() {
            const input = document.getElementById('encodeInput');
            const encodedText = input.value;
            try {
                const decoded = decodeURIComponent(escape(atob(encodedText)));
                input.value = decoded;
            } catch (error) {
                alert('Invalid Base64 string');
            }
        }

        function decodeBase64(str) {
            try {
                return decodeURIComponent(escape(atob(str)));
            } catch (error) {
                return str; // Return original if not base64
            }
        }

        function encodeBase64(str) {
            return btoa(unescape(encodeURIComponent(str)));
        }

        // Card Management Functions
        function loadFromJSON() {
            try {
                const jsonText = document.getElementById('jsonEditor').value;
                cardsData = JSON.parse(jsonText);
                renderCards();
            } catch (error) {
                alert('Invalid JSON format. Please check your syntax.');
                console.error('JSON Parse Error:', error);
            }
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            cardsData.forEach((card, index) => {
                if (card.type === 'meme') {
                    container.appendChild(createMemeCard(card, index));
                } else if (card.type === 'code') {
                    container.appendChild(createCodeCard(card, index));
                }
            });
        }

        function createMemeCard(card, index) {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'meme-card';
            cardDiv.dataset.index = index;
            const decodedConcept = decodeBase64(card.concept);
            cardDiv.innerHTML = `
                <div class="meme-card-inner">
                    <div class="meme-card-front">
                        <img src="${card.image || '/imgs/fallback.jpeg'}" alt="Meme" class="meme-img" >
                    </div>
                    <div class="meme-card-back">
                        <div class="concept-text">${escapeHtml(decodedConcept)}</div>
                    </div>
                </div>
            `;

            cardDiv.addEventListener('click', () => {
                if (!isPresentationMode) {
                    cardDiv.classList.toggle('flipped');
                } else {
                    showCardInPresentation(index);
                }
            });

            return cardDiv;
        }

        function createCodeCard(card, index) {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'code-card';
            cardDiv.dataset.index = index;
            const decodedCode = decodeBase64(card.code);
            cardDiv.innerHTML = `
                <div class="code-header">
                    <span class="code-title">${card.title}</span>
                    <button class="execute-btn" onclick="executeCode(${index})">▶ Execute</button>
                </div>
                <div class="code-content">
                    <div class="code-block">${escapeHtml(decodedCode)}</div>
                    <div class="output-section" id="output-${index}">
                        <em>Click "Execute" to see the output...</em>
                    </div>
                </div>
            `;

            cardDiv.addEventListener('click', (e) => {
                if (isPresentationMode && !e.target.classList.contains('execute-btn')) {
                    showCardInPresentation(index);
                }
            });

            return cardDiv;
        }

        function executeCode(index) {
            const card = cardsData[index];
            const outputDiv = document.getElementById(`output-${index}`);
            const decodedOutput = decodeBase64(card.output);
            
            outputDiv.innerHTML = `<strong>Output:</strong><br>${escapeHtml(decodedOutput)}`;
            outputDiv.classList.add('has-output');

            outputDiv.style.opacity = '0';
            setTimeout(() => {
                outputDiv.style.transition = 'opacity 0.5s ease';
                outputDiv.style.opacity = '1';
            }, 100);
        }

        // Presentation Mode Functions
        function startPresentation() {
            if (cardsData.length === 0) {
                alert('Please load some cards first!');
                return;
            }

            isPresentationMode = true;
            document.body.classList.add('presentation-active');
            currentSlide = 0;
            showCardInPresentation(currentSlide);
            updateNavigationButtons();
            document.addEventListener('keydown', handleKeyPress);
        }

        function showCardInPresentation(index) {
            currentSlide = index;
            const presentationView = document.getElementById('cardPresentationView');
            presentationView.innerHTML = '';
            
            const card = cardsData[index];
            
            if (card.type === 'meme') {
                const presentationCard = createPresentationMemeCard(card, index);
                presentationView.appendChild(presentationCard);
            } else if (card.type === 'code') {
                const presentationCard = createPresentationCodeCard(card, index);
                presentationView.appendChild(presentationCard);
            }
            
            presentationView.classList.add('active');
            document.getElementById('slideCounter').textContent = `${index + 1} / ${cardsData.length}`;
            updateNavigationButtons();
        }

        function createPresentationMemeCard(card, index) {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'presentation-meme-card';
            const decodedConcept = decodeBase64(card.concept);
            cardDiv.innerHTML = `
                <div class="presentation-meme-inner">
                    <div class="presentation-meme-front">
                        <img src="${card.image || '/imgs/fallback.jpeg'}" alt="Meme" class="presentation-meme-img">
                    </div>
                    <div class="presentation-meme-back">
                        <div class="presentation-concept-text">${escapeHtml(decodedConcept)}</div>
                    </div>
                </div>
            `;

            cardDiv.addEventListener('click', () => {
                cardDiv.classList.toggle('flipped');
            });

            return cardDiv;
        }

        function createPresentationCodeCard(card, index) {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'presentation-code-card';
            const decodedCode = decodeBase64(card.code);
            cardDiv.innerHTML = `
                <div class="presentation-code-header">
                    <span class="presentation-code-title">${card.title}</span>
                    <button class="presentation-execute-btn" onclick="executePresentationCode(${index})">▶ Execute</button>
                </div>
                <div class="presentation-code-content">
                    <div class="presentation-code-section">
                        <div class="presentation-code-block">${escapeHtml(decodedCode)}</div>
                    </div>
                    <div class="presentation-output-container">
                        <div class="output-label">Output</div>
                        <div class="presentation-output-section" id="presentation-output-${index}">
                            <em>Click "Execute" to see the output...</em>
                        </div>
                    </div>
                </div>
            `;

            return cardDiv;
        }

        function executePresentationCode(index) {
            const card = cardsData[index];
            const outputDiv = document.getElementById(`presentation-output-${index}`);
            const decodedOutput = decodeBase64(card.output);
            
            outputDiv.innerHTML = `<strong>Result:</strong><br><br>${escapeHtml(decodedOutput)}`;
            outputDiv.classList.add('has-output');

            outputDiv.style.opacity = '0';
            setTimeout(() => {
                outputDiv.style.transition = 'opacity 0.5s ease';
                outputDiv.style.opacity = '1';
            }, 100);
        }

        function changeSlide(direction) {
            const newSlide = currentSlide + direction;
            if (newSlide >= 0 && newSlide < cardsData.length) {
                currentSlide = newSlide;
                showCardInPresentation(currentSlide);
            }
        }

        function updateNavigationButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            prevBtn.disabled = currentSlide === 0;
            nextBtn.disabled = currentSlide === cardsData.length - 1;
        }

        function exitPresentation() {
            isPresentationMode = false;
            document.body.classList.remove('presentation-active');
            document.getElementById('cardPresentationView').classList.remove('active');
            document.removeEventListener('keydown', handleKeyPress);
        }

        function handleKeyPress(event) {
            if (!isPresentationMode) return;
            
            switch(event.key) {
                case 'ArrowLeft':
                case 'ArrowUp':
                    changeSlide(-1);
                    break;
                case 'ArrowRight':
                case 'ArrowDown':
                case ' ':
                    changeSlide(1);
                    break;
                case 'Escape':
                    exitPresentation();
                    break;
            }
        }

        // Utility Functions
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function exportJSON() {
            const jsonString = JSON.stringify(cardsData, null, 2);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'learning-cards-base64.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function clearAll() {
            if (confirm('Are you sure you want to clear all cards?')) {
                cardsData = [];
                document.getElementById('cardsContainer').innerHTML = '';
                document.getElementById('jsonEditor').value = '';
            }
        }

        function addNewCard() {
            const cardType = prompt('Enter card type (meme or code):');
            if (cardType === 'meme') {
                const imageUrl = prompt('Enter image URL:') || 'https://via.placeholder.com/400x300/ff6b6b/ffffff?text=New+Meme';
                const concept = prompt('Enter concept explanation:') || 'Add your concept explanation here...';
                const newCard = {
                    type: 'meme',
                    image: imageUrl,
                    concept: encodeBase64(concept)
                };
                cardsData.push(newCard);
            } else if (cardType === 'code') {
                const title = prompt('Enter code title:') || 'New Code Example';
                const code = prompt('Enter your code:') || '// Add your code here\nconsole.log("Hello, World!");';
                const output = prompt('Enter expected output:') || 'Hello, World!';
                const newCard = {
                    type: 'code',
                    title: title,
                    code: encodeBase64(code),
                    output: encodeBase64(output)
                };
                cardsData.push(newCard);
            } else {
                alert('Invalid card type. Please enter "meme" or "code".');
                return;
            }
            
            updateJSONEditor();
            renderCards();
        }

        function updateJSONEditor() {
            document.getElementById('jsonEditor').value = JSON.stringify(cardsData, null, 2);
        }

        // Initialize with sample data
        window.addEventListener('load', () => {
            loadFromJSON();
            startPresentation();
        });
    </script>
</body>
</html>
